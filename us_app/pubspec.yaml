name: us_app
description: Our couple companion app — V2
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.3.0

  # State management
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^14.2.0

  # UI Core
  flutter_screenutil: ^5.9.0
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.0.0
  shimmer: ^3.0.0

  # V2 UI Additions
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  smooth_page_indicator: ^1.1.0
  flutter_staggered_grid_view: ^0.7.0
  pin_code_fields: ^8.0.1

  # Image handling
  image_picker: ^1.0.7
  image_cropper: ^12.2.1
  palette_generator: ^0.3.3+3

  # Notifications
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0

  # Storage + network
  http: ^1.2.0
  dio: ^5.4.1
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Date + time
  intl: ^0.19.0
  table_calendar: ^3.0.9
  timeago: ^3.6.1

  # Charts
  fl_chart: ^0.66.2

  # Misc utils
  uuid: ^4.3.3
  url_launcher: ^6.2.4
  share_plus: ^10.0.0
  permission_handler: ^11.3.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/fonts/
